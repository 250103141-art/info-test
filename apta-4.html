<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-апта: Python жолдар мен тізімдер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F8FC; --grid:#E2E9F3; --sheet:#FFFFFF; --ink:#18233A; --muted:#5A6782;
  --line:#D3DCE9; --margin:#AFC2EE; --accent:#2B4EC4; --accent-soft:#E8EEFC;
  --ok:#157A4A; --ok-bg:#E2F3E9; --bad:#BE3328; --bad-bg:#FBE6E3;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1522; --grid:#172133; --sheet:#141D2D; --ink:#E5EBF5; --muted:#97A5BE;
    --line:#26324A; --margin:#34477A; --accent:#8AA4FF; --accent-soft:#1C2848;
    --ok:#56CF91; --ok-bg:#12301F; --bad:#FF8073; --bad-bg:#3A1815;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1522; --grid:#172133; --sheet:#141D2D; --ink:#E5EBF5; --muted:#97A5BE;
  --line:#26324A; --margin:#34477A; --accent:#8AA4FF; --accent-soft:#1C2848;
  --ok:#56CF91; --ok-bg:#12301F; --bad:#FF8073; --bad-bg:#3A1815;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px; margin:0 auto; padding:0 16px 64px}

header.intro{padding:44px 4px 28px}
header.intro h1{
  font-family:var(--display); font-weight:700; font-size:clamp(28px,6.4vw,46px);
  line-height:1.08; letter-spacing:-0.01em; margin:0 0 14px; max-width:15ch;
}
header.intro p{margin:0; color:var(--muted); max-width:52ch}

.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); margin:0 -16px; padding:10px 16px;
}
.bar-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:14px; font-size:15px}
.track{flex:1; height:8px; border-radius:99px; background:var(--line); overflow:hidden; display:flex}
.track span{height:100%; transition:width .35s ease}
.track .t-ok{background:var(--ok)} .track .t-bad{background:var(--bad)}
.stat{white-space:nowrap; color:var(--muted)}
.stat b{color:var(--ink); font-weight:600}

.sheet{
  margin-top:20px; background:var(--sheet); border:1px solid var(--line); border-radius:16px;
  position:relative; overflow:hidden;
}
.sheet::before{
  content:""; position:absolute; top:0; bottom:0; left:64px; width:2px; background:var(--margin);
}
.q{display:grid; grid-template-columns:64px 1fr; border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.num{
  font-family:var(--display); font-weight:500; font-size:22px; color:var(--accent);
  text-align:center; padding-top:26px;
}
.body{padding:24px 22px 26px 22px; min-width:0}
.topic{font-size:14px; color:var(--muted); margin:0 0 4px}
.qtext{font-size:19px; font-weight:500; line-height:1.45; margin:0 0 16px}

.opts{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.opt{
  width:100%; display:flex; align-items:flex-start; gap:12px; text-align:left;
  font:inherit; color:inherit; background:transparent; cursor:pointer;
  border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; line-height:1.4;
  transition:border-color .15s, background-color .15s;
}
.opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.opt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.opt:disabled{cursor:default}
.letter{
  flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  font-weight:600; font-size:14px; border:1.5px solid var(--line); margin-top:-2px;
}
.opt-text{padding-top:1px; overflow-wrap:anywhere}
.opt.is-correct{border-color:var(--ok); background:var(--ok-bg)}
.opt.is-correct .letter{background:var(--ok); border-color:var(--ok); color:var(--sheet)}
.opt.is-wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.is-wrong .letter{background:var(--bad); border-color:var(--bad); color:var(--sheet)}
.opt.is-dim{opacity:.55}

.fb{display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease}
.fb.open{grid-template-rows:1fr}
.fb > div{overflow:hidden}
.fb-card{margin-top:14px; padding:14px 16px; border-radius:12px; border-left:4px solid var(--ok); background:var(--ok-bg)}
.fb.bad .fb-card{border-left-color:var(--bad); background:var(--bad-bg)}
.verdict{font-weight:600; margin:0 0 4px; color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}
.verdict span{color:var(--ink); font-weight:500}
.expl{margin:0; overflow-wrap:anywhere}
.expl ul,.expl ol{margin:6px 0 0; padding-left:22px}
.expl li{margin:2px 0}
.expl b{font-weight:600}
.code{margin:0 0 12px; padding:14px 16px; border-radius:10px; background:var(--accent-soft);
  font-family:var(--mono); font-size:15px; line-height:1.6; overflow-x:auto; white-space:pre; tab-size:4}
.inp{margin:0 0 16px; color:var(--muted); font-size:15px}
code{font-family:var(--mono); font-size:.92em}
.inp code, .qtext code{background:var(--accent-soft); padding:1px 6px; border-radius:6px; color:var(--ink)}
.opts.mono .opt-text{font-family:var(--mono); font-size:15px}

.result{
  display:none; margin-top:20px; padding:26px 24px; border-radius:16px;
  background:var(--sheet); border:1px solid var(--line);
}
.result.show{display:block}
.result h2{font-family:var(--display); font-weight:700; font-size:clamp(24px,5vw,34px); margin:0 0 6px; line-height:1.15}
.result p{margin:0 0 18px; color:var(--muted)}
.actions{display:flex; flex-wrap:wrap; gap:10px}
.btn{
  font:inherit; font-weight:600; font-size:16px; cursor:pointer; border-radius:12px; padding:12px 18px;
  border:1.5px solid var(--accent); background:var(--accent); color:var(--sheet);
}
.btn.ghost{background:transparent; color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.btn[hidden]{display:none}

@media (max-width:560px){
  body{font-size:16px}
  .sheet::before{left:44px}
  .q{grid-template-columns:44px 1fr}
  .num{font-size:17px; padding-top:22px}
  .body{padding:20px 14px 22px 14px}
  .qtext{font-size:17px}
  .opt{padding:10px 12px; gap:10px}
}
@media (prefers-reduced-motion: reduce){
  .fb,.track span,.opt{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <h1>Python: жолдар мен тізімдер</h1>
    <p>4-апта, 20 сұрақ. Жауапты таңдасаң, дұрыс па, қате ме бірден көресің, ал түсіндірме сол сұрақтың астында ашылады.</p>
  </header>

  <div class="bar" role="status" aria-live="polite">
    <div class="bar-inner">
      <div class="track" aria-hidden="true"><span class="t-ok" id="tOk" style="width:0"></span><span class="t-bad" id="tBad" style="width:0"></span></div>
      <div class="stat">Дұрыс <b id="sOk">0</b> / <b id="sDone">0</b></div>
    </div>
  </div>

  <main class="sheet" id="sheet"></main>

  <section class="result" id="result" aria-live="polite">
    <h2 id="rTitle"></h2>
    <p id="rText"></p>
    <div class="actions">
      <button class="btn" id="retryWrong" type="button">Қателерді қайта шешу</button>
      <button class="btn ghost" id="restart" type="button">Басынан бастау</button>
    </div>
  </section>
</div>

<script>
const Q = [
 {
  "t": "Кесінділер",
  "q": "Программа не шығарады?",
  "c": "s = \"информатика\"\nprint(s[-3:] + s[:2])",
  "mono": true,
  "o": [
   "ткаин",
   "икаин",
   "икаинф",
   "акиин"
  ],
  "a": 1,
  "e": "s[-3:] — соңғы үш символ, яғни «ика». s[:2] — 0 және 1 индекстегі символдар, яғни «ин». Тұзақ: s[:2] 2-индексті де қамтиды деп ойлап, «инф» алу (C)."
 },
 {
  "t": "Қадаммен кесу",
  "q": "Программа не шығарады?",
  "c": "s = \"Python\"\nprint(s[::-1], s[1:5:2])",
  "mono": true,
  "o": [
   "nohtyP yh",
   "nohtyP yto",
   "Python yh",
   "nohty yt"
  ],
  "a": 0,
  "e": "[::-1] жолды кері айналдырады. s[1:5:2] 1 және 3 индекстерін алады, яғни «y» мен «h». 5-индекс кесіндіге кірмейді."
 },
 {
  "t": "find() және rfind()",
  "q": "Программа не шығарады?",
  "c": "s = \"банан\"\nprint(s.find(\"н\"), s.rfind(\"н\"), s.find(\"к\"))",
  "mono": true,
  "o": [
   "2 4 0",
   "3 5 −1",
   "2 4 −1",
   "2 2 −1"
  ],
  "a": 2,
  "e": "Индекстер 0-ден басталады: б0 а1 н2 а3 н4. find() бірінші кездескен орынды, rfind() соңғы кездескен орынды береді. Ізделген символ табылмаса, нәтиже −1 болады, 0 емес. B нұсқасы индексті 1-ден санаған қате."
 },
 {
  "t": "replace() және жолдың өзгермейтіндігі",
  "q": "Программа не шығарады?",
  "c": "s = \"кітап\"\ns.replace(\"к\", \"қ\")\nprint(s)",
  "o": [
   "қітап",
   "кітап",
   "Қате шығады",
   "қ"
  ],
  "a": 1,
  "e": "replace() жаңа жол қайтарады, бастапқы s жолын өзгертпейді. Нәтиже ешқайда меншіктелмегендіктен, s сол күйінде қалады. <code>s = s.replace(\"к\", \"қ\")</code> деп жазылса, «қітап» шығар еді."
 },
 {
  "t": "replace() санымен",
  "q": "Программа не шығарады?",
  "c": "s = \"ананас\"\nprint(s.replace(\"а\", \"о\", 2), s.count(\"а\"))",
  "mono": true,
  "o": [
   "ононос 3",
   "ононас 3",
   "ононас 1",
   "онанас 3"
  ],
  "a": 1,
  "e": "Үшінші аргумент 2 болғандықтан, тек алғашқы екі «а» ауыстырылады. Ал count() бастапқы s жолынан санайды, ол өзгермеген, сондықтан 3. C нұсқасы ауыстырылғаннан кейінгі жолдан санаған қате."
 },
 {
  "t": "ord() және chr()",
  "q": "Программа не шығарады?",
  "c": "print(ord(\"B\") - ord(\"A\"), chr(ord(\"a\") + 2))",
  "mono": true,
  "o": [
   "1 c",
   "1 b",
   "66 c",
   "B c"
  ],
  "a": 0,
  "e": "ord(\"B\") = 66, ord(\"A\") = 65, айырмасы 1. ord(\"a\") = 97, 97 + 2 = 99, ал chr(99) = «c»."
 },
 {
  "t": "Жолдарды салыстыру",
  "q": "Программа не шығарады?",
  "c": "print(\"abc\" < \"abd\", \"a\" > \"A\", \"10\" < \"9\")",
  "mono": true,
  "o": [
   "True True False",
   "True True True",
   "True False True",
   "False True True"
  ],
  "a": 1,
  "e": "Жолдар символ-символ, ASCII коды бойынша салыстырылады.<ul><li>«c» (99) &lt; «d» (100), сондықтан бірінші шарт True.</li><li>«a» (97) &gt; «A» (65), сондықтан екінші шарт True.</li><li>«1» (49) &lt; «9» (57), сондықтан \"10\" &lt; \"9\" те True. Тұзақ: оларды сан ретінде салыстырып, 10 &lt; 9 жалған деп ойлау.</li></ul>"
 },
 {
  "t": "split() және join()",
  "q": "Программа не шығарады?",
  "c": "s = \"1-2-3\"\na = s.split(\"-\")\nprint(\"+\".join(a), len(a))",
  "mono": true,
  "o": [
   "6 3",
   "1+2+3 3",
   "1+2+3 5",
   "['1', '2', '3'] 3"
  ],
  "a": 1,
  "e": "split(\"-\") жолды ['1', '2', '3'] тізіміне бөледі. join() оларды «+» арқылы қайта жолға біріктіреді. Нәтиже есептелмейді, ол жай жол. Тұзақ: өрнекті есептеп, 6 деп жазу."
 },
 {
  "t": "isdigit()",
  "q": "Программа не шығарады?",
  "c": "print(\"12.5\".isdigit(), \"-7\".isdigit(), \"007\".isdigit())",
  "mono": true,
  "o": [
   "True True True",
   "False False True",
   "True False True",
   "False True True"
  ],
  "a": 1,
  "e": "isdigit() жол тек цифрлардан тұрса ғана True береді. Нүкте мен минус цифр емес, сондықтан алғашқы екеуі False. \"007\" тек цифрлардан тұрады."
 },
 {
  "t": "Тізім әдістері",
  "q": "Программа не шығарады?",
  "c": "A = [5, 3, 8, 1]\nA.sort()\nA.append(0)\nprint(A[0], A[-1], A.index(8))",
  "mono": true,
  "o": [
   "0 8 3",
   "1 0 3",
   "1 0 2",
   "0 8 4"
  ],
  "a": 1,
  "e": "sort() тізімді [1, 3, 5, 8] етеді. append(0) элементті сұрыпталған тізімнің соңына қосады: [1, 3, 5, 8, 0]. Тізім қайта сұрыпталмайды. A[0] = 1, A[-1] = 0, ал 8-дің индексі 3."
 },
 {
  "t": "remove() және pop()",
  "q": "Программа не шығарады?",
  "c": "A = [3, 1, 3, 2, 3]\nA.remove(3)\nA.pop(1)\nprint(A)",
  "mono": true,
  "o": [
   "[1, 2]",
   "[1, 2, 3]",
   "[3, 2, 3]",
   "[2, 3]"
  ],
  "a": 1,
  "e": "remove(3) тек бірінші кездескен 3-ті жояды: [1, 3, 2, 3]. pop(1) мәні 1 элементті емес, 1-индекстегі элементті (3-ті) жояды: [1, 2, 3]. A нұсқасы remove() барлық 3-ті жояды деп ойлаған қате."
 },
 {
  "t": "Генератор",
  "q": "Программа не шығарады?",
  "c": "A = [i * 2 for i in range(1, 5)]\nprint(sum(A), len(A))",
  "mono": true,
  "o": [
   "20 4",
   "30 5",
   "20 5",
   "10 4"
  ],
  "a": 0,
  "e": "range(1, 5) 1, 2, 3, 4 сандарын береді, 5 кірмейді. Сондықтан A = [2, 4, 6, 8], қосындысы 20, ұзындығы 4."
 },
 {
  "t": "append() және extend()",
  "q": "Программа не шығарады?",
  "c": "A = [1, 2]\nA.append([3, 4])\nB = [1, 2]\nB.extend([3, 4])\nprint(len(A), len(B))",
  "mono": true,
  "o": [
   "4 4",
   "3 4",
   "4 3",
   "3 3"
  ],
  "a": 1,
  "e": "append() тізімді бір элемент ретінде қосады: [1, 2, [3, 4]], ұзындығы 3. extend() элементтерді бөлек-бөлек тіркейді: [1, 2, 3, 4], ұзындығы 4."
 },
 {
  "t": "Жол мен тізімнің айырмашылығы",
  "q": "Python-да жолдың тізімнен маңызды айырмашылығы:",
  "o": [
   "Жолда индекстеу жоқ",
   "Жолды кесуге болмайды",
   "Жолдың жеке символын өзгертуге болмайды",
   "Жолдың ұзындығын анықтау мүмкін емес"
  ],
  "a": 2,
  "e": "Жол өзгермейтін тип. <code>s[0] = \"A\"</code> жазылса, TypeError қатесі шығады. Жолды өзгерту үшін ескі бөліктерден жаңа жол құру керек. Индекстеу, кесу және len() жолда да жұмыс істейді."
 },
 {
  "t": "Форматтау",
  "q": "% операторымен форматтауда бүтін ондық санды қоятын спецификатор:",
  "mono": true,
  "o": [
   "%s",
   "%d",
   "%f",
   "%x"
  ],
  "a": 1,
  "e": "%s — жол, %f — нақты сан (үнсіз келісім бойынша 6 таңбамен: 3.500000), %x — он алтылық сан."
 },
 {
  "t": "Элементті жою",
  "q": "Тізімнен элементті индекс бойынша жойып, жойылған мәнді қайтармайтын құрал:",
  "mono": true,
  "o": [
   "a.pop(x)",
   "del a[x]",
   "a.remove(x)",
   "a.clear()"
  ],
  "a": 1,
  "e": "pop(x) та индекс бойынша жояды, бірақ жойылған мәнді қайтарады, айырмашылығы осында. remove(x) мән бойынша жояды. clear() барлық элементті жояды."
 },
 {
  "t": "Python тізімі",
  "q": "Python тізімі туралы дұрыс тұжырым:",
  "o": [
   "Тек бір типті элементтерді сақтайды",
   "Әртүрлі типтегі элементтерді сақтай алады",
   "Өлшемін алдын ала көрсету міндетті",
   "Индекстер 1-ден басталады"
  ],
  "a": 1,
  "e": "Мысалы, <code>A = [12, 'b', 34.6, 'derevo']</code> дұрыс тізім. «Элементтері бір типті» деген қасиет классикалық массивке (array модулі) тән. Тізімнің өлшемі кез келген уақытта өзгере алады, ал индекстер 0-ден басталады."
 },
 {
  "t": "randint()",
  "q": "<code>randint(1, 10)</code> функциясы қандай сандарды бере алады?",
  "o": [
   "1-ден 9-ға дейін",
   "1-ден 10-ға дейін",
   "0-ден 10-ға дейін",
   "0-ден 9-ға дейін"
  ],
  "a": 1,
  "e": "randint() аралықтың екі шетін де қамтиды. Тұзақ: range(1, 10) сияқты 10 кірмейді деп ойлау."
 },
 {
  "t": "Сұрыптау",
  "q": "Тізімді кему ретімен сұрыптайтын әдіс:",
  "mono": true,
  "o": [
   "a.sort()",
   "a.reverse()",
   "a.sort(reverse=True)",
   "a.sort(-1)"
  ],
  "a": 2,
  "e": "Тұзақ — B нұсқасы: reverse() сұрыптамайды, тек элементтердің ретін кері айналдырады. Сондықтан [3, 1, 2] тізімі [2, 1, 3] болады."
 },
 {
  "t": "Файлмен жұмыс",
  "q": "Нәтижені output.txt файлына жазу үшін файл қай режимде ашылады?",
  "mono": true,
  "o": [
   "\"r\"",
   "\"w\"",
   "\"read\"",
   "\"input\""
  ],
  "a": 1,
  "e": "\"r\" оқуға арналған режим. Жазылған деректер файлда сақталуы үшін соңында close() міндетті түрде шақырылуы керек."
 }
];

const L = ["A","B","C","D","E","F"];
const answers = Q.map(() => null);
const sheet = document.getElementById("sheet");

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function build(){
  sheet.innerHTML = "";
  Q.forEach((item, qi) => {
    const art = el("article","q"); art.id = "q" + qi;
    art.appendChild(el("div","num", String(qi + 1)));
    const body = el("div","body");
    body.appendChild(el("p","topic", item.t));
    const qt = el("p","qtext"); qt.innerHTML = item.q; qt.id = "qt" + qi;
    body.appendChild(qt);
    if (item.c){
      const pre = el("pre","code"); const cd = el("code", null, item.c);
      pre.appendChild(cd); body.appendChild(pre);
    }
    if (item.inp){
      const p = el("p","inp"); p.appendChild(document.createTextNode("Енгізу: "));
      item.inp.forEach((v, k) => {
        if (k) p.appendChild(document.createTextNode(" және "));
        p.appendChild(el("code", null, v));
      });
      body.appendChild(p);
    }

    const ul = el("ul", item.mono ? "opts mono" : "opts");
    ul.setAttribute("role","group");
    ul.setAttribute("aria-labelledby","qt" + qi);
    item.o.forEach((txt, oi) => {
      const li = el("li");
      const b = el("button","opt"); b.type = "button";
      b.appendChild(el("span","letter", L[oi]));
      b.appendChild(el("span","opt-text", txt));
      b.addEventListener("click", () => choose(qi, oi));
      li.appendChild(b); ul.appendChild(li);
    });
    body.appendChild(ul);

    const fb = el("div","fb"); fb.setAttribute("aria-live","polite");
    const inner = el("div"); const card = el("div","fb-card");
    const v = el("p","verdict"); const ex = el("div","expl"); ex.innerHTML = item.e;
    card.appendChild(v); card.appendChild(ex); inner.appendChild(card); fb.appendChild(inner);
    body.appendChild(fb);

    art.appendChild(body);
    sheet.appendChild(art);
  });
  refresh();
}

function paint(qi){
  const item = Q[qi], chosen = answers[qi];
  const art = document.getElementById("q" + qi);
  const btns = art.querySelectorAll(".opt");
  const fb = art.querySelector(".fb");
  const v = art.querySelector(".verdict");
  btns.forEach((b, oi) => {
    b.classList.remove("is-correct","is-wrong","is-dim");
    b.disabled = chosen !== null;
    b.removeAttribute("aria-label");
    if (chosen === null) return;
    if (oi === item.a) b.classList.add("is-correct");
    else if (oi === chosen) b.classList.add("is-wrong");
    else b.classList.add("is-dim");
  });
  if (chosen === null){ fb.classList.remove("open","bad"); v.textContent = ""; return; }
  const right = chosen === item.a;
  fb.classList.toggle("bad", !right);
  v.textContent = "";
  if (right){
    v.textContent = "Дұрыс!";
  } else {
    v.appendChild(document.createTextNode("Қате. "));
    v.appendChild(el("span", null, "Дұрыс жауап: " + L[item.a] + ") " + item.o[item.a]));
  }
  requestAnimationFrame(() => fb.classList.add("open"));
}

function choose(qi, oi){
  if (answers[qi] !== null) return;
  answers[qi] = oi;
  paint(qi);
  refresh();
}

function refresh(){
  const done = answers.filter(a => a !== null).length;
  const ok = answers.filter((a, i) => a === Q[i].a).length;
  const bad = done - ok;
  document.getElementById("sOk").textContent = ok;
  document.getElementById("sDone").textContent = done;
  document.getElementById("tOk").style.width = (ok / Q.length * 100) + "%";
  document.getElementById("tBad").style.width = (bad / Q.length * 100) + "%";

  const res = document.getElementById("result");
  if (done === Q.length){
    res.classList.add("show");
    document.getElementById("rTitle").textContent = Q.length + " сұрақтан " + ok + " дұрыс";
    document.getElementById("rText").textContent = bad === 0
      ? "Барлығы дұрыс. Тақырып жақсы меңгерілген."
      : "Қате кеткен " + bad + " сұрақты қайта шешіп көр. Түсіндірмелерді оқығаннан кейін оңайырақ болады.";
    document.getElementById("retryWrong").hidden = bad === 0;
  } else {
    res.classList.remove("show");
  }
}

document.getElementById("retryWrong").addEventListener("click", () => {
  let first = -1;
  answers.forEach((a, i) => {
    if (a !== null && a !== Q[i].a){ answers[i] = null; paint(i); if (first < 0) first = i; }
  });
  refresh();
  if (first >= 0){
    const target = document.getElementById("q" + first);
    target.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    target.querySelector(".opt").focus({preventScroll:true});
  }
});

document.getElementById("restart").addEventListener("click", () => {
  answers.fill(null);
  Q.forEach((_, i) => paint(i));
  refresh();
  window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});

build();
</script>
</body>
</html>
